<script>
'use strict';
const KEY='toefl-weekly-v1', CFG='toefl-cloud-v1', TIMER='toefl-timer-v1';
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>crypto.randomUUID();
const day=d=>{let t=d?new Date(d+'T12:00:00'):new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}, addDay=(d,n)=>{let t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return day(t.toISOString().slice(0,10))}, days=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);
let storageFailed=false;function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){storageFailed=true;return fallback}}function persist(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch(e){storageFailed=true;alert('浏览器未能保存数据，请立即导出备份。可能是存储已满或浏览器限制。');return false}}
let db=read(KEY,{version:1,events:[],owner:null}),cfg=read(CFG,{}),timer=read(TIMER,null),view='week',selectedWeek=1,busy=false,syncMessage='本地保存模式',syncDebounce;
const subjects={R:'Reading 阅读',L:'Listening 听力',S:'Speaking 口语',W:'Writing 写作',X:'综合 / 复盘'};
const tags={VOC:'词汇不认识',SOUND:'认识但没听出来',MEM:'听懂但忘了',LOGIC:'逻辑 / 结构',NOTE:'笔记干扰',Q:'题目 / 选项理解',ATTN:'走神',TIME:'超时',PAUSE:'停顿 / 流畅度',CONTENT:'内容 / 展开',GRAMMAR:'语法',PRON:'可理解度 / 发音',REGISTER:'语气 / 任务完成'};
const types={R:['Reading'],L:['Listening'],S:['Listen and Repeat','Interview'],W:['Build a Sentence','Email','Discussion'],X:['综合复盘','模考训练']};
const HUB='https://www.ets.org/toefl/teachers-advisors-agents/ibt/teaching/preparing-students.html',READY='https://www.ets.org/preparation-toefl/testready.html',TPO='https://toefl.zhan.com/tpo/',KMF='https://toefl.kmf.com/',PDF='https://www.ets.org/content/dam/ets-org/pdfs/toefl/';
const resources=[['ETS 教师资源：Lesson Plans / Teacher PT1–5',HUB],['ETS TestReady：免费内容 / baseline',READY],['ETS Practice Test 1（第 8 周保留题）',PDF+'toefl-ibt-full-length-practice-test-1.pdf'],['ETS Practice Test 2（考前 7–10 天）',PDF+'toefl-ibt-full-length-practice-test-2.pdf'],['Speaking Rubrics',PDF+'speaking-rubrics.pdf'],['Writing Rubrics',PDF+'writing-rubrics.pdf'],...['reading','listening','speaking','writing'].map(s=>[s+' Lesson Plan',PDF+'toefl-ibt-lesson-plan-'+s+'.pdf']),['小站 TPO',TPO],['考满分（免费替补）',KMF],['Cambridge Dictionary','https://dictionary.cambridge.org/'],['YouGlish','https://youglish.com/'],['NEEA 托福报名：核实深圳考位','https://toefl.neea.cn/']];
const SOP={R:['限时做题约 25 分钟（旧 TPO 一篇 18–20 分钟），做题时不查词。','对答案，只复盘错题和犹豫题约 20 分钟，找出原文证据。','精读最难一段约 10 分钟；记录真正影响理解的词。','填写正确数 / 总题数；典型错题再存入错题本。'],L:['第一轮：听材料并做题，不暂停、不看文本，约 15 分钟。','第二轮：对答案，查看错题对应文本，定位原因，约 20 分钟。','第三轮：关文本重听出错片段，约 15 分钟。','最后 10 分钟复述意群、查声音词并记录结果；最多三轮。'],S:['Listen and Repeat：7 句，听一次立即复述，对照后重录，约 20 分钟。','Interview：完整一轮，不提前看题、不写稿，约 25 分钟。','让 ChatGPT 语音 / Gemini Live 按提示词反馈，约 10 分钟。','只重录最弱一题约 5 分钟；两种题型分别记录训练 rubric。'],W:['Build a Sentence 约 15 分钟；解释错误句子的结构。','Email：首次严格 7 分钟，再检查任务点与语气，合计约 15 分钟。','Discussion：首次严格 10 分钟，再用 AI 反馈，合计约 20 分钟。','最后 10 分钟吸收一个语法问题和可复用表达；分别记录三种题型。'],X:['查看本周成绩与典型错题，不要求逐题补档。','重做最有代表性的错误或重录 / 重写一题。','在统计页看同题型趋势，选择下周补强科目。','保留一句主要收获；统计由程序自动汇总。']};
const themes=['熟悉新版题型','建立基线','官方训练 · PT2','官方训练 · PT3','官方训练 · PT4 / 口语对比','官方训练 · PT5 / 阶段回顾','按弱项调整','中期检查 · Practice Test 1','新版专项强化','进入考试模式','弱项冲刺 I','弱项冲刺 II / 耐力模拟','修复最重要的两项','最终官方检查 · Practice Test 2','考前稳定与轻量维护'];
function records(kind){let map=new Map;for(const e of [...db.events].sort((a,b)=>a.at.localeCompare(b.at)||a.id.localeCompare(b.id)))if(e.kind===kind)map.set(e.key,e);return [...map.values()].filter(e=>!e.deleted).map(e=>({...e.data,id:e.key,_at:e.at}))}
function getSettings(){return {start:'2026-09-15',exam:'2026-12-26',priority:'L',...records('settings')[0]}}
function event(kind,key,data,deleted=false){const e={id:uid(),kind,key,data,deleted,at:new Date().toISOString()};db.events.push(e);persist(KEY,db);queueSync();return e}
function currentWeek(){return Math.min(15,Math.max(1,Math.floor(days(day(),getSettings().start)/7)+1))}
function plan(){let out=[],priority=getSettings().priority;for(let w=1;w<=15;w++){let i=0;const put=(s,title,source,url=HUB,min=60,steps=null)=>out.push({id:`w${w}-${++i}`,week:w,s,title,source,url,min,steps:steps||SOP[s]});
if(w===1){for(const [s,name]of Object.entries(subjects).slice(0,4))put(s,name+' 题型入门','ETS '+name.split(' ')[0]+' Lesson Plan',PDF+'toefl-ibt-lesson-plan-'+name.split(' ')[0].toLowerCase()+'.pdf');put('X','熟悉 TestReady 免费 sampler','ETS TestReady',READY);put('S','口语初次录音 + 写作重写','本周 Lesson Plan',HUB,60,['30 分钟：回听 Interview，重录最弱一题。','30 分钟：重写一篇 Email，找 AI 获取反馈，科目用时可分两条记录。']);put('X','首周复习与材料整理','本周已做示例');}
else if(w===2){for(const s of ['R','L','S','W'])put(s,subjects[s]+' 官方训练','Teacher Practice Test 1');put('X','完整 baseline + 保存官方反馈','TestReady Free Practice Test',READY,120,['预留约 2 小时，优先连续完成免费完整练习。','记录四科官方反馈；只把报告实际提供的分数录入模考表。','如果免费入口不可用，使用未做的 Teacher PT 材料并标为练习，不冒充官方分数。']);put('X','基线回顾与典型错题清理','Teacher PT1 / baseline');}
else if(w>=3&&w<=6){for(const s of ['R','L','S','W'])put(s,subjects[s]+' 官方训练',`Teacher Practice Test ${w-1}`);put('R','旧 TPO 学术阅读 1 篇',`小站 TPO${w+37}`,TPO);put(w===5?'S':'L',w===5?'对比基线录音，重录一轮 Interview':'旧 TPO 精听 1 个 lecture / conversation',w===5?'Week 2 与本周口语':`小站 TPO${w+37}`,w===5?HUB:TPO);put('X',w===6?'四周趋势回顾与补强选择':'典型错题重做与周回顾','本周已做材料');}
else if(w===8){for(const s of ['R','L','S','W'])put(s,subjects[s]+' 中期检查','ETS Practice Test 1',PDF+'toefl-ibt-full-length-practice-test-1.pdf');put('X','阅读 / 听力错题复盘','Practice Test 1');put('X','口语 / 写作 rubric 反馈','Practice Test 1');put('X','中期对比与下阶段重点','Week 2 与 Week 8 数据');}
else if(w===12||w===14){put('X',w===12?'完整耐力模拟':'最终官方完整检查',w===12?'小站 / KMF 免费新版模考；无免费则组合未做官方题':'ETS Practice Test 2',w===12?KMF:PDF+'toefl-ibt-full-length-practice-test-2.pdf',120,['连续按 Reading → Listening → Writing → Speaking 完成，预留约 2 小时。','首次作答不暂停、不查词，练习科目切换与专注。',w===14?'安排在正式考试前 7–10 天；本周任务可提前打开完成。':'第三方若收费，改用未完整做过的官方内容，不必购买。','纸面练习不能复刻自适应机制，正确率不换算正式分数。']);for(const s of ['R','L','S','W'])put(s,subjects[s]+' 模考复盘与修复',w===14?'Practice Test 2 已做题':'本周模拟已做题');put('X','总结不稳定题型与时间问题','本周模考反馈');}
else if(w===15){put(priority,'最弱项典型题修复','历史错题',HUB,90);put('S','熟悉题口语轻量维护','已做 Interview / L&R',HUB,60);put('W','熟悉题写作轻量维护','已做 Email / Discussion',HUB,60);put('R','阅读限时与证据回顾','历史阅读题',HUB,60);put('L','听力轻量维护','熟悉音频',HUB,60);put('X','常错词 / 表达回收','个人错题本',HUB,60);put('X','考试流程与物品确认','NEEA 报名信息','https://toefl.neea.cn/',30,['确认考点地址、到场要求、证件与交通。','考前一天最多轻练 30–40 分钟，不为清空欠量熬夜。']);}
else{for(const s of ['R','L','S','W'])put(s,subjects[s]+(w>=10?' 严格限时训练':' 新版专项训练'),'ETS 未做 Lesson Plan / TestReady 免费内容；不足用小站新版',READY);put(priority,subjects[priority]+' 额外补强','最近薄弱题型；小站新版免费题',TPO);put(w===13?priority:'S',w===13?'第二轮重点修复':'Interview 30 分钟 + 写作重写 30 分钟','历史题 / 新版免费题',KMF);put('X','重做典型错题与周回顾','本周材料');}}
return out.map(t=>{
const frozen=taskState(t.id).snapshot;
if(frozen)return {...t,...frozen};
if(t.week===1&&Number(t.id.split('-')[1])<=4)t.steps=['先读对应 Lesson Plan 的题型说明与例题，约 15 分钟。','完成示例训练约 25 分钟；口语实际开口，写作亲自作答。','对照答案或对应 rubric，分析最不熟悉的部分约 15 分钟。','最后 5 分钟填结果，保存一条典型问题即可。'];
if(t.week>=9&&t.week<=11&&t.s==='R')t.steps=['10 分钟 Complete the Words；10 分钟 Read in Daily Life。','20 分钟 Academic Passage，新版题不足时用旧 TPO 一篇。','15 分钟只复盘错题和犹豫题；5 分钟记录结果。'];
if(t.week>=9&&t.week<=11&&t.s==='L')t.steps=['10 分钟 Listen and Choose a Response；10 分钟 Conversation。','10 分钟 Announcement；15 分钟 Academic Talk。','10 分钟回听问题片段；5 分钟记录结果。首次播放不暂停。'];

})}
function taskState(id){return records('task').find(x=>x.id===id)||{done:false}}
function spent(id){return records('log').filter(x=>x.task===id).reduce((n,x)=>n+Number(x.minutes||0),0)}
function remaining(t){return taskState(t.id).done?0:Math.max(0,t.min-spent(t.id))}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
function metric(n,label){return `<div class="metric"><strong>${n}</strong><span>${label}</span></div>`}
function options(obj,sel,blank=false){return (blank?'<option value="">不记录</option>':'')+Object.entries(obj).map(([k,v])=>`<option value="${esc(k)}" ${k===sel?'selected':''}>${esc(v)}</option>`).join('')}
function link(name,url){return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)} ↗</a>`}
function weekRange(w){let s=getSettings().start;return `${addDay(s,(w-1)*7)} — ${addDay(s,w*7-1)}`}
function showModal(html){$('#modal').innerHTML='<button class="close" aria-label="关闭" onclick="document.querySelector(\'#modal\').close()">×</button>'+html;$('#modal').showModal()}
function render(){const tabs={week:'本周任务',stats:'统计与成绩',errors:'错题本',ai:'AI 练习',resources:'资料入口',settings:'同步与设置'};$('#nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${view===k?'active':''}" data-view="${k}">${v}</button>`).join('');$('#syncstatus').textContent=syncMessage;$('#app').innerHTML=({week:renderWeek,stats:renderStats,errors:renderErrors,ai:renderAI,resources:renderResources,settings:renderSettings}[view])();renderTimer()}
function renderWeek(){const p=plan(),s=getSettings(),own=p.filter(t=>t.week===selectedWeek),carry=p.filter(t=>t.week<selectedWeek&&!taskState(t.id).done),done=own.filter(t=>taskState(t.id).done).length,logs=records('log'),from=addDay(s.start,(selectedWeek-1)*7),to=addDay(from,6),actual=logs.filter(l=>l.date>=from&&l.date<=to).reduce((n,l)=>n+Number(l.minutes),0),debt=carry.reduce((n,t)=>n+remaining(t),0),left=[...carry,...own].filter(t=>!taskState(t.id).done),before=days(day(),s.start)<0;return `<div class="row spread"><div><h1>第 ${selectedWeek} 周 · ${themes[selectedWeek-1]}</h1><div class="muted">${weekRange(selectedWeek)} · 任意时间完成，可分多次学习</div></div><label><span class="sr">查看周次</span><select class="weekselect" onchange="selectedWeek=Number(this.value);render()">${themes.map((t,i)=>`<option value="${i+1}" ${selectedWeek===i+1?'selected':''}>第 ${i+1} 周 · ${t}</option>`).join('')}</select></label></div>${before?'<div class="notice">计划 9 月 15 日开始，现在可以熟悉界面，也可以提前完成任务。</div>':''}<div class="metrics">${metric('7 <small>h</small>','本周新增课程量')}${metric((debt/60).toFixed(1)+' <small>h</small>',`递延参考用时 · ${carry.length} 项未完成`)}${metric(done+' / '+own.length,'本周新任务已完成')}${metric((actual/60).toFixed(1)+' <small>h</small>','本周实际投入')}</div><div class="grid"><section><div class="row spread" style="margin-bottom:14px"><h2>训练清单</h2><span class="pill">${left.length} 项待完成 · 参考 ${((420+debt)/60).toFixed(1)} 小时</span></div>${carry.length?'<p class="muted">历史任务保留原周次，仅递延未完成项，不重复生成。计时超出预算但未勾完成的任务仍会保留。</p>':''}<div class="cards">${[...carry,...own].map(t=>taskCard(t)).join('')}</div></section><aside><div class="panel"><h3>这一周，按你的节奏</h3><p class="muted">点“开始计时”或直接填记录。做了一部分就暂存，完成训练与复盘后再勾选完成。</p><div class="progress"><i style="width:${done/own.length*100}%"></i></div><p>${done===own.length?'本周新任务已完成。':'一次只做一项，也可以连学两小时。'}</p><button onclick="openLog()">＋ 自由学习记录</button></div><div class="panel"><h3>当前补强科目</h3><select aria-label="补强科目" onchange="savePriority(this.value)">${options(Object.fromEntries(Object.entries(subjects).slice(0,4)),s.priority)}</select><p class="muted">用于第 7、9–11、13、15 周的弹性训练。已开始的训练以你实际记录的科目为准。</p></div><div class="panel"><h3>深圳 · 线下考试</h3><p>${esc(s.exam)} <span class="muted">暂定</span></p><p class="muted">公开年度时间表末场为 12 月 26 日；深圳考位需在报名系统核实。日期可在设置中改。</p>${link('核实考位','https://toefl.neea.cn/')}<p class="muted">Practice Test 2 建议窗口：${addDay(s.exam,-10)} 至 ${addDay(s.exam,-7)}。考前停止追赶欠量，以休息和稳定为主。</p></div></aside></div>`}
function taskCard(t){let st=taskState(t.id),used=spent(t.id);return `<article class="task ${st.done?'done':''}"><div><span class="tag">${subjects[t.s]}</span>${t.week<selectedWeek?`<span class="tag carry">第 ${t.week} 周递延</span>`:''}<span class="muted">${t.min} 分钟参考量 · 已投入 ${Math.round(used)} 分钟</span></div><h3>${esc(t.title)}</h3><div class="muted">${esc(t.source)}</div><details><summary>材料入口与训练步骤</summary><p>${link('打开材料',t.url)}</p><ol class="steps">${t.steps.map(s=>'<li>'+esc(s)+'</li>').join('')}</ol></details><div class="row"><button class="primary" onclick="startTimer('${t.id}')">开始计时</button><button onclick="openLog('${t.id}')">填学习记录</button><button onclick="toggleTask('${t.id}')">${st.done?'↶ 取消完成':'✓ 标记完成'}</button></div></article>`}
function toggleTask(id){event('task',id,{...taskState(id),done:!taskState(id).done,snapshot:plan().find(t=>t.id===id)});render()}
function savePriority(s){event('settings','main',{...getSettings(),priority:s});render();toast('补强科目已更新')}
function openLog(taskId='',id='',minutes=''){let old=records('log').find(x=>x.id===id),t=plan().find(x=>x.id===taskId),v=old||{task:taskId,date:day(),s:t?.s||'R',type:types[t?.s||'R'][0],source:t?.source||'',minutes,correct:'',total:'',score:'',tag:'',note:''};showModal(`<h2>${id?'编辑':'添加'}学习记录</h2><p class="muted">用时记一次即可。口语 / 写作多个题型可另加成绩记录，用时填 0，避免重复统计。</p><form id="logform"><div class="fields"><label>学习日期<input name="date" type="date" required value="${esc(v.date)}"></label><label>用时（分钟，可为 0）<input name="minutes" type="number" min="0" max="1440" step="0.1" required value="${esc(v.minutes)}"></label><label>科目<select name="s" onchange="updateTypes(this.value)">${options(subjects,v.s)}</select></label><label>题型<select name="type" id="logtype">${options(Object.fromEntries(types[v.s].map(x=>[x,x])),v.type)}</select></label><label class="wide">关联任务<select name="task"><option value="">自由学习，不关联任务</option>${plan().map(t=>`<option value="${t.id}" ${v.task===t.id?'selected':''}>W${t.week} · ${esc(t.title)}</option>`).join('')}</select></label><label class="wide">材料 / 题目来源<input name="source" value="${esc(v.source)}" required></label><label>正确数（可选）<input name="correct" type="number" min="0" step="1" value="${esc(v.correct)}"></label><label>总题数（可选）<input name="total" type="number" min="1" step="1" value="${esc(v.total)}"></label><label>训练 rubric 0–5（可选）<input name="score" type="number" min="0" max="5" step="0.1" value="${esc(v.score)}"></label><label>主要问题（可选）<select name="tag">${options(tags,v.tag,true)}</select></label><label class="wide">AI 结论 / 备注（可选）<textarea name="note">${esc(v.note)}</textarea></label></div><details><summary>更多统计字段（可选）</summary><div class="fields" style="margin-top:12px"><label>复盘后正确数（使用上方总题数）<input name="untimed" type="number" min="0" step="1" value="${esc(v.untimed??'')}"></label><label>超时次数<input name="timeouts" type="number" min="0" step="1" value="${esc(v.timeouts??'')}"></label><label>作文词数<input name="words" type="number" min="1" step="1" value="${esc(v.words??'')}"></label><label>语法错误数<input name="grammar" type="number" min="0" step="1" value="${esc(v.grammar??'')}"></label></div></details><button class="primary" type="submit">保存记录</button></form>`);$('#logform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{validateLog(d);if(d.task&&!taskState(d.task).snapshot)event('task',d.task,{...taskState(d.task),snapshot:plan().find(t=>t.id===d.task)});event('log',id||uid(),d);$('#modal').close();render();toast('记录已保存，统计已更新')}catch(err){alert(err.message)}}}
function updateTypes(s){$('#logtype').innerHTML=options(Object.fromEntries(types[s].map(x=>[x,x])),types[s][0])}
function validateLog(d){if(!subjects[d.s]||!types[d.s].includes(d.type)||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!d.source.trim())throw Error('请填写有效的科目、题型、日期和材料。');for(const f of ['minutes','correct','total','score']){if(d[f]===null||d[f]===undefined)d[f]='';if(d[f]!==''&&(!Number.isFinite(Number(d[f]))||Number(d[f])<0))throw Error('数值必须为非负数。')}if(d.minutes===''||Number(d.minutes)>1440)throw Error('用时应为 0–1440 分钟。');if((d.correct==='')!==(d.total==='')||d.total!==''&&(Number(d.total)<1||Number(d.correct)>Number(d.total)||!Number.isInteger(Number(d.correct))||!Number.isInteger(Number(d.total))))throw Error('正确数与总题数需一起填写，正确数不能超过总题数。');if(d.score!==''&&Number(d.score)>5)throw Error('训练 rubric 为 0–5，正式分数请填模考表。');if(d.tag&&!tags[d.tag])throw Error('未知的问题标签。');
for(const k of ['untimed','timeouts','words','grammar']){if(d[k]==null)d[k]='';if(d[k]!==''&&(!Number.isInteger(Number(d[k]))||Number(d[k])<0))throw Error('附加统计必须为非负整数。')}
if(d.untimed!==''&&(d.total===''||Number(d.untimed)>Number(d.total)))throw Error('复盘后正确数需要总题数，且不能超过总题数。');
if((d.words==='')!==(d.grammar==='')||d.words!==''&&Number(d.words)<1)throw Error('作文词数与语法错误数需要一起填写，词数至少为 1。')}
function startTimer(id){if(timer){toast('已有计时任务，请先暂停并保存或放弃。');return}if(!taskState(id).snapshot)event('task',id,{...taskState(id),snapshot:plan().find(t=>t.id===id)});timer={task:id,start:Date.now(),elapsed:0};persist(TIMER,timer);renderTimer()}
function timerMs(){return timer?timer.elapsed+(timer.start?Date.now()-timer.start:0):0}
function pauseTimer(){if(!timer)return;if(timer.start){timer.elapsed=timerMs();timer.start=null}else timer.start=Date.now();persist(TIMER,timer);renderTimer()}
function saveTimer(){if(!timer)return;timer.elapsed=timerMs();timer.start=null;persist(TIMER,timer);let saved=timer;openLog(timer.task,'',Math.round(timer.elapsed/6000)/10);let handler=$('#logform').onsubmit;$('#logform').onsubmit=e=>{handler(e);if(!$('#modal').open){timer=null;persist(TIMER,null);renderTimer()}};renderTimer()}
function discardTimer(){if(confirm('放弃这次未保存计时？')){timer=null;persist(TIMER,null);renderTimer()}}
function renderTimer(){if(!timer){$('#timerbar').innerHTML='';return}let ms=timerMs(),name=plan().find(t=>t.id===timer.task)?.title||'训练';$('#timerbar').innerHTML=`<div class="muted" style="color:#bcd1df">${esc(name)}</div><div class="row"><b class="amount">${Math.floor(ms/3600000)}:${String(Math.floor(ms/60000)%60).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}</b><button onclick="pauseTimer()">${timer.start?'暂停':'继续'}</button><button onclick="saveTimer()">保存用时</button><button aria-label="放弃计时" onclick="discardTimer()">×</button></div>`}
setInterval(renderTimer,1000);
function accuracy(ls){let a=ls.filter(x=>x.total!==''&&x.total!=null&&Number(x.total)>0),total=a.reduce((n,x)=>n+Number(x.total),0);return total?Math.round(a.reduce((n,x)=>n+Number(x.correct),0)/total*100):null}
function mean(ls){let a=ls.filter(x=>x.score!==''&&x.score!=null);return a.length?(a.reduce((n,x)=>n+Number(x.score),0)/a.length).toFixed(2):null}
function renderStats(){const logs=records('log').sort((a,b)=>b.date.localeCompare(a.date)),recent=logs.filter(l=>l.date>=addDay(day(),-6)&&l.date<=day()),mins=recent.reduce((n,l)=>n+Number(l.minutes),0),errors=records('error'),groups=Object.values(types).flat().filter(t=>!types.X.includes(t));return `<div class="row spread"><div><h1>统计与成绩</h1><p class="muted">正确率按总题数加权；不同题型分别统计。训练 rubric 不换算正式分数。</p></div><div class="row"><button onclick="openMock()">＋ 模考成绩</button><button class="primary" onclick="openLog()">＋ 学习记录</button></div></div><div class="metrics">${metric((mins/60).toFixed(1)+' h','最近 7 天投入')}${metric(logs.length,'累计训练记录')}${metric(errors.length,'典型错题')}${metric(records('mock').length,'模考报告')}</div><div class="split"><div class="panel"><h2>最近 7 天 · 四科用时</h2>${Object.entries(subjects).map(([s,name])=>{let n=recent.filter(l=>l.s===s).reduce((n,l)=>n+Number(l.minutes),0);return `<div class="row spread"><span>${name}</span><span>${Math.round(n)} 分钟 · ${mins?Math.round(n/mins*100):0}%</span></div><div class="progress"><i style="width:${mins?n/mins*100:0}%"></i></div>`}).join('')}</div><div class="panel"><h2>周回顾 · 自动汇总</h2>${reviewText(recent)}<p class="muted">只分析近期已填数据，不把阅读正确率与口语 rubric 直接比较。样本不足时不判断“最弱科”。</p><button onclick="view='week';render()">选择下周补强科目</button></div></div><section class="panel sectiongap"><h2>分题型趋势</h2><div class="tablewrap"><table><thead><tr><th>题型</th><th>近 7 天正确率</th><th>近 7 天 rubric</th><th>前 7 天正确率 / rubric</th><th>近期样本</th></tr></thead><tbody>${groups.map(t=>{let a=recent.filter(x=>x.type===t),b=logs.filter(x=>x.type===t&&x.date>=addDay(day(),-13)&&x.date<addDay(day(),-6));return `<tr><td>${t}</td><td>${accuracy(a)===null?'—':accuracy(a)+'%'}</td><td>${mean(a)??'—'}</td><td>${accuracy(b)===null?'—':accuracy(b)+'%'} / ${mean(b)??'—'}</td><td>${a.length} 次</td></tr>`}).join('')}</tbody></table></div><details class="sectiongap"><summary>附加指标：复盘正确率、超时与语法错误</summary><div class="tablewrap"><table><thead><tr><th>题型</th><th>复盘后正确率（近 7 天）</th><th>超时次数</th><th>语法错误 / 100 词</th></tr></thead><tbody>${groups.map(t=>{let a=recent.filter(x=>x.type===t),u=a.filter(x=>x.untimed!==''&&x.untimed!=null&&Number(x.total)>0),g=a.filter(x=>Number(x.words)>0&&x.grammar!==''&&x.grammar!=null),n=g.reduce((n,x)=>n+Number(x.words),0);return `<tr><td>${t}</td><td>${u.length?Math.round(u.reduce((n,x)=>n+Number(x.untimed),0)/u.reduce((n,x)=>n+Number(x.total),0)*100)+'%':'—'}</td><td>${a.some(x=>x.timeouts!==''&&x.timeouts!=null)?a.reduce((n,x)=>n+Number(x.timeouts||0),0):'—'}</td><td>${n?(g.reduce((n,x)=>n+Number(x.grammar),0)/n*100).toFixed(1):'—'}</td></tr>`}).join('')}</tbody></table></div></details><h3 class="sectiongap">15 周实际学习时间</h3><div class="bars">${Array.from({length:15},(_,i)=>{let a=addDay(getSettings().start,i*7),b=addDay(a,6),n=logs.filter(x=>x.date>=a&&x.date<=b).reduce((n,x)=>n+Number(x.minutes),0)/60;return `<div class="bar" style="height:${Math.min(100,n/14*100)}%" title="第 ${i+1} 周 ${n.toFixed(1)} 小时"><span>${n?n.toFixed(1):''}</span><small>${i+1}</small></div>`}).join('')}</div><p class="muted">横轴为周次，数值为小时；柱高最多显示 14 小时。</p></section><section class="panel sectiongap"><h2>训练记录 · 可编辑</h2>${logs.length?`<div class="tablewrap"><table class="mobiletable"><thead><tr><th>日期 / 题型</th><th>材料</th><th>分钟</th><th>正确 / 总数</th><th>Rubric</th><th>问题 / 结论</th><th>操作</th></tr></thead><tbody>${logs.map(l=>`<tr><td data-label="日期 / 题型">${esc(l.date)}<br>${esc(l.type)}</td><td data-label="材料">${esc(l.source)}</td><td data-label="用时">${esc(l.minutes)}</td><td data-label="正确 / 总数">${l.total!==''?esc(l.correct)+' / '+esc(l.total):'—'}</td><td data-label="Rubric">${l.score!==''?esc(l.score):'—'}</td><td data-label="问题 / 结论">${esc(tags[l.tag]||'')}<br>${esc(l.note)}</td><td><button onclick="openLog('','${l.id}')">编辑</button> <button class="danger" onclick="removeRecord('log','${l.id}')">删除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有成绩。完成第一项训练后，从任务卡填写即可。</div>'}</section><section class="panel sectiongap"><h2>模考报告 · 与训练分开保存</h2>${records('mock').map(m=>`<div class="row spread" style="border-bottom:1px solid var(--line);padding:12px 0"><div><b>${esc(m.date)} · ${esc(m.source)}</b><div>${esc(m.scale)} · R ${esc(m.R||'—')} / L ${esc(m.L||'—')} / S ${esc(m.S||'—')} / W ${esc(m.W||'—')} / 总分 ${esc(m.overall||'—')}</div><div class="muted">${esc(m.note)}</div></div><div><button onclick="openMock('${m.id}')">编辑</button> <button onclick="removeRecord('mock','${m.id}')">删除</button></div></div>`).join('')||'<p class="muted">仅录入报告实际提供的分数，不从正确率推算。</p>'}</section>`}
function reviewText(ls){if(!ls.length)return '<p>最近 7 天还没有训练记录。先完成一次训练，再看反馈。</p>';let counts={};ls.forEach(x=>{if(x.tag)counts[x.tag]=(counts[x.tag]||0)+1});let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];let suggestions=[];for(const type of ['Reading','Listening','Build a Sentence']){let a=ls.filter(x=>x.type===type&&x.total!=='');if(a.length>=2&&accuracy(a)<80)suggestions.push(type+' 正确率 '+accuracy(a)+'%，适合补强')}for(const type of ['Listen and Repeat','Interview','Email','Discussion']){let a=ls.filter(x=>x.type===type&&x.score!=='');if(a.length>=2&&Number(mean(a))<4)suggestions.push(type+' rubric '+mean(a)+'，适合补强')}return `<p>${top?'本周最常记录的问题是「'+tags[top[0]]+'」，出现 '+top[1]+' 次。':'本周未填写问题标签。'}</p><p>${suggestions.length?suggestions.map(esc).join('；')+'。':'目前没有足够证据指定弱项，继续积累同题型记录。'}</p>`}
function openMock(id=''){let m=records('mock').find(x=>x.id===id)||{date:day(),source:'',scale:'新版 1–6',R:'',L:'',S:'',W:'',overall:'',note:''};showModal(`<h2>模考报告</h2><form id="mockform"><div class="fields"><label>日期<input name="date" type="date" required value="${esc(m.date)}"></label><label>量表<select name="scale">${options({'新版 1–6':'新版 1–6','旧版 0–120':'旧版 0–120','仅定性反馈':'仅定性反馈'},m.scale)}</select></label><label class="wide">报告来源<input name="source" required value="${esc(m.source)}" placeholder="例如 TestReady 官方报告 / 第三方练习"></label>${['R','L','S','W','overall'].map(s=>`<label>${s==='overall'?'Overall 总分':subjects[s]}<input name="${s}" type="number" min="0" step="0.5" value="${esc(m[s])}"></label>`).join('')}<label class="wide">备注<textarea name="note">${esc(m.note)}</textarea></label></div><button class="primary">保存报告</button></form>`);$('#mockform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));for(const k of ['R','L','S','W','overall'])if(d[k]!==''&&(d.scale==='仅定性反馈'||Number(d[k])>(d.scale==='新版 1–6'?6:k==='overall'?120:30)||(d.scale==='新版 1–6'&&Number(d[k])<1))){alert('分数与所选量表不符。');return}event('mock',id||uid(),d);$('#modal').close();render()}}
function removeRecord(kind,id){if(confirm('删除这条记录？删除也会同步到其他设备。')){event(kind,id,{},true);render()}}
let errorFilter='';function renderErrors(){let all=records('error'),rows=all.filter(x=>!errorFilter||x.s===errorFilter);return `<div class="row spread"><div><h1>典型错题本</h1><p class="muted">科目与材料用于归档。每道错题填写六项，选有代表性的错误即可。</p></div><button class="primary" onclick="openError()">＋ 添加错题</button></div><div class="panel"><div class="row"><label>筛选科目<select onchange="errorFilter=this.value;render()"><option value="">全部科目</option>${options(subjects,errorFilter)}</select></label><span class="muted">共 ${rows.length} 题</span></div><div class="row" style="margin:10px 0 20px">${Object.entries(tags).map(([t,n])=>{let c=rows.filter(x=>x.tag===t).length;return c?`<span class="tag">${n} ${c}</span>`:''}).join('')}</div>${rows.length?`<table class="mobiletable"><thead><tr><th>题号 / 材料</th><th>我的答案</th><th>正确答案</th><th>错误标签</th><th>原因</th><th>下次做法</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td data-label="题号 / 材料">${esc(x.number)}<div class="muted">${esc(subjects[x.s])} · ${esc(x.source)}</div></td><td data-label="我的答案">${esc(x.mine)}</td><td data-label="正确答案">${esc(x.correct)}</td><td data-label="错误标签">${esc(tags[x.tag])}</td><td data-label="原因">${esc(x.reason)}</td><td data-label="下次做法">${esc(x.action)}</td><td><button onclick="openError('${x.id}')">编辑</button> <button class="danger" onclick="removeRecord('error','${x.id}')">删除</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">还没有错题。无需补历史记录，从下一道典型错误开始。</div>'}</div>`}
function openError(id=''){let x=records('error').find(x=>x.id===id)||{s:'R',source:'',number:'',mine:'',correct:'',tag:'Q',reason:'',action:''};showModal(`<h2>错题模板</h2><form id="errorform"><div class="fields"><label>科目<select name="s">${options(subjects,x.s)}</select></label><label>材料<input name="source" value="${esc(x.source)}" required></label><label>① 题号<input name="number" value="${esc(x.number)}" required></label><label>④ 错误标签<select name="tag">${options(tags,x.tag)}</select></label><label>② 我的答案<textarea name="mine">${esc(x.mine)}</textarea></label><label>③ 正确答案<textarea name="correct">${esc(x.correct)}</textarea></label><label>⑤ 原因<textarea name="reason">${esc(x.reason)}</textarea></label><label>⑥ 下次做法<textarea name="action">${esc(x.action)}</textarea></label></div><button class="primary">保存错题</button></form>`);$('#errorform').onsubmit=e=>{e.preventDefault();event('error',id||uid(),Object.fromEntries(new FormData(e.target)));$('#modal').close();render()}}
let aiType='Interview';
function promptText(type){let speaking=['Interview','Listen and Repeat'].includes(type),s=speaking?'S':'W';let specific={Interview:'模拟 Take an Interview，一次只问一个问题，不提前展示后续题，不给模板、关键词或准备时间。等我回答后进入下一问，共 4 问。全部结束才反馈，考察切题、展开、自然语速、停顿、可理解度、语法与词汇。', 'Listen and Repeat':'请用语音给出 7 个逐渐变长的自然英语句子，贴近校园、工作或公共场景。一次只读一句，读一次，等我立即复述后再显示原文。逐句检查内容保留、意义准确、遗漏、替换和可理解度，再让我重录。AI 生成句明确标为辅助训练材料。',Email:'我会提供 Email 题目和我的原始答案，缺少时先向我索取。先列出所有交际任务点，检查是否完成、语气与礼貌是否合适，再分析影响清晰度的语法和词汇。先反馈后给改写，保留我的意思和大致语言水平。首次作答按 7 分钟训练，由我自行计时。',Discussion:'我会提供教授的问题、学生回复和我的答案，缺少时先向我索取。检查是否直接回应、是否有自己的贡献、解释和例子、是否过多复述他人，以及语言准确度。先反馈后给改写。首次作答按 10 分钟训练，由我自行计时。'}[type];return `你是我的 2026 新版 TOEFL 训练反馈助手，训练题型：${type}。
${specific}

评分依据：请参考 ETS 对应题型 rubric。我会在需要时提供官方评分文本。若你无法访问或确认原文，请明确说明，不能声称已经严格核对。Speaking rubric：${PDF}speaking-rubrics.pdf；Writing rubric：${PDF}writing-rubrics.pdf。
只给 0–5 的训练性 rubric 判断，允许保留一位小数；不是 ETS 官方成绩，也不换算 1–6 或 0–120。不能判断时填 null。
${speaking?'只在实际能听到并分析我的原始音频时评价发音、停顿与节奏。只有文字转写时，这些维度写“无法判断”，不要根据转写猜测。语音训练结束后，请切换到文字输出结果，供我复制。':'批改后提取 3 个可复用表达。'}
反馈只抓最重要的 3 个改进点，给具体动作。最后用一句话总结最大问题。
选一个主要标签：${Object.entries(tags).map(([k,v])=>k+'='+v).join('；')}。无明显问题可填空字符串。

最后输出一个严格 JSON 代码块，不要把解释混在 JSON 中，结构如下：
{
  "s": "${s}",
  "type": "${type}",
  "source": "填实际材料或 AI 辅助训练",
  "score": null,
  "tag": "",
  "note": "一句最大问题 + 一个下次动作"
}
将 score 的 null 替换为你有依据的训练性评分；不能评则保留 null。不要捏造日期、训练时长或正确题数。${type==='Listen and Repeat'?'score 填本轮可评句子的平均训练分，并在 note 说明实际评了几句。':''}`}
function renderAI(){return `<h1>AI 练习与反馈</h1><p class="muted">复制完整提示词 → 在 ChatGPT 语音或 Gemini Live 训练 → 复制文字反馈数据 → 导入后检查保存。</p><div class="split"><section class="panel"><label>训练题型<select onchange="aiType=this.value;render()">${options(Object.fromEntries(['Interview','Listen and Repeat','Email','Discussion'].map(x=>[x,x])),aiType)}</select></label><button class="primary" onclick="copyPrompt()">复制完整提示词</button><pre id="prompttext">${esc(promptText(aiType))}</pre></section><section class="panel"><h2>粘贴 AI 返回的数据</h2><p class="muted">粘贴 JSON 代码块即可。会先填入可编辑表单，不会直接替你保存。用时请填实际值。</p><textarea id="aipaste" style="min-height:250px" placeholder='{"s":"S","type":"Interview","score":3.5,"source":"AI 辅助训练","tag":"PAUSE","note":"…"}'></textarea><button class="primary" onclick="importAI()">解析并检查</button><div class="notice">语音结束后，让 AI 输出文字数据。如果只拿到转写，发音和停顿应标为无法判断。</div><p>${link('ChatGPT','https://chatgpt.com/')} · ${link('Gemini','https://gemini.google.com/')}</p></section></div>`}
async function copyPrompt(){try{await navigator.clipboard.writeText(promptText(aiType));toast('提示词已复制')}catch(e){let range=document.createRange();range.selectNodeContents($('#prompttext'));let sel=getSelection();sel.removeAllRanges();sel.addRange(range);toast('已选中提示词，请手动复制')}}
function parseAI(raw){let d=JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));if(!['S','W'].includes(d.s)||!types[d.s].includes(d.type)||!['Interview','Listen and Repeat','Email','Discussion'].includes(d.type))throw Error('只接受口语 / 写作的指定题型。');if(d.score!==null&&(typeof d.score!=='number'||d.score<0||d.score>5))throw Error('score 必须为 0–5 数字或 null。');if(typeof d.source!=='string'||typeof d.note!=='string'||typeof d.tag!=='string'||d.tag&&!tags[d.tag])throw Error('请检查 source、note、tag 字段。');return d}
function importAI(){try{let d=parseAI($('#aipaste').value);openLog();const f=$('#logform');f.elements.s.value=d.s;updateTypes(d.s);for(const k of ['type','source','tag','note'])f.elements[k].value=d[k];f.elements.score.value=d.score??'';f.elements.minutes.focus()}catch(e){alert('解析失败：'+e.message)}}
function renderResources(){return `<h1>资料入口</h1><p class="muted">材料沿用你的原计划。外部练习需要联网，具体免费内容以平台当前开放情况为准。</p><div class="panel">${resources.map(([n,u])=>`<p>${link(n,u)}</p>`).join('')}<div class="notice warn">Practice Test 1 保留给第 8 周；Practice Test 2 保留至考前 7–10 天。练习正确率不能直接换算官方分数。</div><h3>考试日期依据</h3><p>${link('2026 大陆年度考试时间表（新东方转述）','https://toefl.xdf.cn/202512/15051944.html')}：末场为 12 月 26 日；深圳实际考位以 NEEA 登录后查询为准，当前尚未验证考位。</p></div>`}
function renderSettings(){const s=getSettings();return `<h1>同步与设置</h1><p class="muted">本地无需账号即可使用。手机电脑自动同步，需要一次性配置免费 Supabase 项目。</p><div class="split"><section class="panel"><h2>计划设置</h2><form id="settingsform" onsubmit="saveSettings(event)"><label>开始日期<input name="start" type="date" value="${esc(s.start)}" required></label><label>考试日期（未确认考位）<input name="exam" type="date" value="${esc(s.exam)}" required></label><p class="muted">每周以开始日期为锚点计算连续 7 天，不固定到星期几。修改开始日期会改变统计周区间，历史记录日期保留。</p><button class="primary">保存日期</button></form><h3 class="sectiongap">数据备份</h3><p class="muted">导出包含全部进度、记录和修改历史，不包含密码或云端登录令牌。导入以合并方式恢复。</p><div class="row"><button onclick="exportData()">导出完整备份</button><button onclick="document.querySelector('#backupfile').click()">导入备份</button></div><input type="file" id="backupfile" accept="application/json,.json" style="display:none" onchange="importBackup(this.files[0])"><p class="muted">双击 HTML 的记录只属于当前浏览器与文件位置。首次转到在线网址，请先导出再导入。</p></section><section class="panel"><h2>免费云同步</h2><div class="notice">${esc(syncMessage)}</div><form onsubmit="connectCloud(event)"><label>Supabase Project URL<input name="url" type="url" required placeholder="https://项目编号.supabase.co" value="${esc(cfg.url||'')}"></label><label>Publishable key 或旧版 anon key<input name="key" required value="${esc(cfg.key||'')}" autocomplete="off" placeholder="sb_publishable_…"></label><p class="muted">这里只能填浏览器公开密钥，不能填 secret 或 service_role。数据库权限由配套 SQL 限制为本人。</p><label>邮箱<input name="email" type="email" required value="${esc(cfg.email||'')}" autocomplete="username"></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" ${busy?'disabled':''}>登录并启用同步</button></form><div class="row sectiongap"><button onclick="syncNow()">立即同步</button><button onclick="logout()">退出云账号</button></div><p class="muted">在 Supabase 后台创建你自己的用户后登录。配置方法见同文件夹的“使用说明.md”和“supabase.sql”。</p><p class="muted">不同设备新增记录自动合并；同一条记录同时修改，采用最后修改版本。备份保留完整修改历史。免费项目低活跃可能暂停，可在后台恢复。</p></section></div>`}
function saveSettings(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(d.exam<=d.start){alert('考试日期必须晚于开始日期。');return}event('settings','main',{...getSettings(),...d});selectedWeek=currentWeek();render();toast('日期已更新')}
function exportData(){download(JSON.stringify({version:1,events:db.events,exportedAt:new Date().toISOString()},null,2),'TOEFL-备份-'+day()+'.json')}
function download(text,name){let u=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function validEvent(e){
try{
const uuid=x=>typeof x==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(x),taskId=x=>/^w([1-9]|1[0-5])-[1-7]$/.test(x),text=x=>typeof x==='string'&&x.length<=20000,date=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&Number.isFinite(Date.parse(x));
if(!e||!uuid(e.id)||!['task','log','error','mock','settings'].includes(e.kind)||typeof e.at!=='string'||!Number.isFinite(Date.parse(e.at))||typeof e.deleted!=='boolean'||!e.data||typeof e.data!=='object'||Array.isArray(e.data))return false;
if(e.kind==='task'?!taskId(e.key):e.kind==='settings'?e.key!=='main':!uuid(e.key))return false;
if(e.deleted)return true;let d=e.data;
if(e.kind==='settings')return date(d.start)&&date(d.exam)&&d.exam>d.start&&['R','L','S','W'].includes(d.priority);
if(e.kind==='task'){if(typeof d.done!=='boolean'&&d.done!==undefined)return false;let t=d.snapshot;return !t||(t.id===e.key&&Number.isInteger(t.week)&&t.week>=1&&t.week<=15&&Object.hasOwn(subjects,t.s)&&text(t.title)&&text(t.source)&&typeof t.url==='string'&&/^https:\/\//.test(t.url)&&Number.isFinite(t.min)&&t.min>=0&&Array.isArray(t.steps)&&t.steps.every(text))}
if(e.kind==='log'){if(!text(d.source)||!text(d.note)||d.task!==''&&!taskId(d.task))return false;validateLog({...d});return true}
if(e.kind==='error')return Object.hasOwn(subjects,d.s)&&Object.hasOwn(tags,d.tag)&&['source','number','mine','correct','reason','action'].every(k=>text(d[k]));
if(e.kind==='mock')return date(d.date)&&text(d.source)&&text(d.note)&&['新版 1–6','旧版 0–120','仅定性反馈'].includes(d.scale)&&['R','L','S','W','overall'].every(k=>d[k]===''||Number.isFinite(Number(d[k]))&&Number(d[k])>=0&&Number(d[k])<=120);
return false;
}catch{return false}}
async function importBackup(file){if(!file)return;try{if(file.size>20000000)throw Error('备份文件超过 20 MB。');let b=JSON.parse(await file.text());if(b.version!==1||!Array.isArray(b.events)||!b.events.every(validEvent))throw Error('不是有效的本程序备份。');let existing=new Set(db.events.map(e=>e.id)),fresh=b.events.filter(e=>!existing.has(e.id));if(!confirm(`合并 ${fresh.length} 条修改记录？相同记录以最后修改版本为准。`))return;db.events.push(...fresh);persist(KEY,db);queueSync();render();toast('备份已合并')}catch(e){alert('导入失败：'+e.message)}}
function status(s){syncMessage=s;$('#syncstatus').textContent=s}
function queueSync(){status(cfg.session?'已保存在本地 · 待同步':'已保存在本地');clearTimeout(syncDebounce);if(cfg.session)syncDebounce=setTimeout(syncNow,1600)}
async function api(path,method='GET',body,auth=true,extra={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{let r=await fetch(cfg.url+path,{method,headers:{apikey:cfg.key,'Content-Type':'application/json',...(auth?{Authorization:'Bearer '+cfg.session.access_token}:{}),...extra},body:body?JSON.stringify(body):undefined,signal:controller.signal});let text=await r.text(),d;try{d=text?JSON.parse(text):null}catch{d=null}if(!r.ok)throw Error(d?.msg||d?.message||d?.error_description||'云服务请求失败 '+r.status);return d}finally{clearTimeout(timeout)}}
async function connectCloud(e){e.preventDefault();if(busy)return;let d=Object.fromEntries(new FormData(e.target)),url=d.url.replace(/\/$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)){alert('请输入 Supabase 项目 https://…supabase.co 地址。');return}if(d.key.startsWith('sb_secret_')){alert('不能在网页中使用 secret key。');return}try{if(d.key.startsWith('ey')){let payload=JSON.parse(atob(d.key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(payload.role==='service_role')throw Error('不能使用 service_role 密钥。')}}catch(err){alert(err.message);return}let previous=cfg;cfg={...cfg,url,key:d.key,email:d.email};busy=true;status('正在登录…');try{let session=await api('/auth/v1/token?grant_type=password','POST',{email:d.email,password:d.password},false);if(db.owner&&db.owner!==session.user.id)throw Error('本地数据已绑定另一账号，请使用原账号，避免混入其他人的记录。');cfg.session=session;cfg.session.expires_at=Date.now()+session.expires_in*1000;db.owner=session.user.id;persist(KEY,db);persist(CFG,cfg);status('已登录 · 正在准备同步')}catch(err){cfg=previous;status('登录失败：'+err.message);alert(err.message)}finally{busy=false}if(cfg.session)await syncNow();render()}
async function syncNow(){if(busy)return;if(!cfg.session){status('本地模式 · 请在设置中登录后同步');return}if(!navigator.onLine){status('离线 · 数据已在本地，联网后同步');return}busy=true;status('同步中…');try{if(Date.now()>=cfg.session.expires_at-60000){const s=await api('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:cfg.session.refresh_token},false);cfg.session={...s,expires_at:Date.now()+s.expires_in*1000};persist(CFG,cfg)}let remote=[];for(let offset=0;;offset+=500){let rows=await api('/rest/v1/toefl_events?select=id,payload&order=id&limit=500&offset='+offset);if(!Array.isArray(rows))throw Error('数据库响应无效。');remote.push(...rows.map(r=>({...r.payload,id:r.id})));if(rows.length<500)break}if(!remote.every(validEvent))throw Error('云端记录格式无效，请先导出本地备份。');let remoteIds=new Set(remote.map(e=>e.id)),localIds=new Set(db.events.map(e=>e.id));let pending=db.events.filter(e=>!remoteIds.has(e.id));for(let i=0;i<pending.length;i+=100)await api('/rest/v1/toefl_events?on_conflict=user_id,id','POST',pending.slice(i,i+100).map(e=>({id:e.id,user_id:cfg.session.user.id,payload:e})),true,{Prefer:'resolution=ignore-duplicates,return=minimal'});db.events.push(...remote.filter(e=>!localIds.has(e.id)));persist(KEY,db);if(db.events.some(e=>!remoteIds.has(e.id)&&!pending.some(p=>p.id===e.id)))queueSync();else status('已同步 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));if(!$('#modal').open&&view!=='settings')render()}catch(e){status('本地已保存 · 同步失败：'+(e.name==='AbortError'?'连接超时':e.message))}finally{busy=false}}
function logout(){if(busy)return;cfg.session=null;persist(CFG,cfg);status('已退出云账号 · 本地记录保留');render()}
window.addEventListener('online',syncNow);window.addEventListener('storage',e=>{if(e.key===KEY){let other=read(KEY,db),ids=new Set(db.events.map(x=>x.id));db.events.push(...other.events.filter(x=>!ids.has(x.id)));db.owner=other.owner||db.owner;if(!$('#modal').open)render()}if(e.key===TIMER){timer=read(TIMER,null);renderTimer()}});
setInterval(()=>{if(cfg.session&&navigator.onLine)syncNow()},60000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
$('#nav').onclick=e=>{let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render();window.scrollTo(0,0)}};
selectedWeek=currentWeek();render();if(storageFailed)toast('发现本地存储异常，请先检查备份。');if(cfg.session)syncNow();
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'read_weekly_toefl_tasks',description:'读取指定周的训练任务、已投入分钟和完成状态，不修改记录。',inputSchema:{type:'object',properties:{week:{type:'integer',minimum:1,maximum:15}},required:['week'],additionalProperties:false},annotations:{readOnlyHint:true},execute:({week})=>{if(!Number.isInteger(week)||week<1||week>15)throw Error('周次必须为 1–15');return plan().filter(t=>t.week<=week&&!taskState(t.id).done).map(t=>({id:t.id,title:t.title,week:t.week,minutes:t.min,spent:spent(t.id)}))}})}catch{}}
</script></body></html>
